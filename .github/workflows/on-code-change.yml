# Build the core module on every pull request. This workflow publishes nothing.
#
# core is the only module Jahia maintains and the only one with a Jahia version, so the build
# names its pom rather than the aggregator. core pins gemini-blueprint-io and
# gemini-blueprint-mock at the upstream 1.0.2.RELEASE, which the Jahia Nexus serves.
name: On Code Change (PR)

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set environment variables from parameters
        shell: bash
        run: |
          echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> "$GITHUB_ENV"
          echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> "$GITHUB_ENV"

      # The compiler plugin targets Java 1.5, which JDK 11 refuses.
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Build with Maven
        shell: bash
        run: >-
          mvn -s .github/maven.settings.xml -ntp -B
          -f core/pom.xml
          -Dmaven.javadoc.skip=true -Dgpg.skip=true
          install
