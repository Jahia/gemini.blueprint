# Build the core module and publish its snapshot to the Jahia Nexus, on every push to the
# maintained branch. core is the only module with a Jahia version, so it is the only one
# published.
name: On merge to the maintained branch

on:
  push:
    branches:
      - '1.0.2.RELEASE-jahia'
    tags-ignore:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish the snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set environment variables from parameters
        shell: bash
        run: |
          echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> "$GITHUB_ENV"
          echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> "$GITHUB_ENV"

      # The compiler plugin targets Java 1.5, which JDK 11 refuses.
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Deploy with Maven
        shell: bash
        run: >-
          mvn -s .github/maven.settings.xml -ntp -B
          -f core/pom.xml
          -Dmaven.javadoc.skip=true -Dgpg.skip=true
          clean deploy

      - name: Report where the artifact landed
        shell: bash
        run: |
          set -euo pipefail
          # setup-java sets MAVEN_ARGS=-ntp, which hides every transfer line, so the location is
          # read from the project rather than from the log.
          ev() {
            mvn -q -B -N -f core/pom.xml -s .github/maven.settings.xml \
              help:evaluate -Dexpression="$1" -DforceStdout
          }
          version="$(ev project.version)"
          case "$version" in
            *-SNAPSHOT) repo="$(ev project.distributionManagement.snapshotRepository.url)" ;;
            *)          repo="$(ev project.distributionManagement.repository.url)" ;;
          esac
          group="$(ev project.groupId | tr '.' '/')"
          echo "::notice title=Snapshot published::${repo%/}/$group/$(ev project.artifactId)/$version/"
